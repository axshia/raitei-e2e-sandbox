name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No conflict markers
        run: "! grep -rnE '^(<<<<<<<|=======|>>>>>>>)( |$)' --exclude-dir=.git ."
      - name: Keep the check pending for a while
        run: sleep 40
